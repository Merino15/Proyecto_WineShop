<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Educativo | WineShop Cultural</title>
    <link rel="stylesheet" href="../css/estilos_wineshop.css">
    <style>
        .quiz-card {
            background-color: var(--color-blanco);
            border: 2px solid var(--color-borde);
            border-radius: 8px;
            padding: var(--espaciado-32);
            max-width: 650px;
            margin: var(--espaciado-40) auto;
            text-align: center;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: var(--espaciado-12);
            margin: var(--espaciado-12) 0;
            background-color: var(--color-neutro-claro);
            border: 2px solid var(--color-borde);
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }
        .option-btn:hover { background-color: var(--color-borde); }
    </style>
</head>
<body>

    <main class="container section-padding">
        <div class="quiz-card">
            <h1 style="font-family: var(--font-titulos); color: var(--color-primario-bordeos);">Zona Divulgativa: Historia de La Rioja</h1>
            <p style="margin: var(--espaciado-16) 0;">Contenido adaptado sobre la geografía del Valle del Ebro y la tradición agrícola centenaria.</p>

            <div id="quiz-body">
                <p id="quiz-question" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 20px;">¿Qué río principal cruza la región vitivinícola de La Rioja?</p>
                <button class="option-btn" onclick="evaluar('incorrecta')">Río Duero</button>
                <button class="option-btn" onclick="evaluar('correcta')">Río Ebro</button>
                <button class="option-btn" onclick="evaluar('incorrecta')">Río Guadalquivir</button>
            </div>

            <div id="quiz-feedback" style="margin-top: 20px; font-weight: 700; display: none;"></div>
            
            <a href="https://www.google.com" class="btn btn-secondary" style="margin-top: 24px;">Salir del sitio web</a>
        </div>
    </main>

    <script>
        function evaluar(resultado) {
            const fb = document.getElementById('quiz-feedback');
            fb.style.display = 'block';
            if (resultado === 'correcta') {
                fb.style.color = '#2E7D32';
                fb.textContent = '¡Correcto! El Río Ebro riega las tierras de Rioja Alta, Rioja Alavesa y Rioja Oriental.';
            } else {
                fb.style.color = '#D32F2F';
                fb.textContent = 'Inténtalo de nuevo. Pista: Es el río más caudaloso de España.';
            }
        }
    </script>
</body>
</html>
