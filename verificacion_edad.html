<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Edad - WineShop</title>

    <!-- Tipografías oficiales: Playfair Display e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <!-- Estilos generales -->
    <link rel="stylesheet" href="css/estilos_wineshop.css">
</head>
<body class="age-gate-body">

    <!-- Enlace de salto accesible WCAG -->
    <a href="#age-gate-container" class="sr-only focus-visible">Saltar a la verificación</a>

    <!-- Pantalla de confirmación de edad -->
    <main id="age-gate-container" class="age-gate-wrapper">
        <div class="age-gate-card">
            <img src="img/transparent-logo.svg" alt="Logotipo WineShop" class="age-gate-logo">
            
            <h1 class="age-gate-title">¿Eres mayor de edad?</h1>
            <p class="body-large age-gate-text">
                Debes tener al menos 18 años para acceder a WineShop y descubrir nuestra selección de vinos y bodegas. Fomentamos el consumo responsable.
            </p>

            <div class="age-gate-actions">
                <button type="button" id="btn-confirm-mayor" class="btn btn-primary btn-full">
                    Sí, tengo 18 años o más
                </button>
                <button type="button" id="btn-confirm-menor" class="btn btn-secondary btn-full">
                    No, soy menor de 18 años
                </button>
            </div>
            
            <p class="age-gate-notice">Al acceder confirmas que cumples con la edad legal de consumo de alcohol en tu país de residencia.</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnMayor = document.getElementById('btn-confirm-mayor');
            const btnMenor = document.getElementById('btn-confirm-menor');

            // Si ya lo verificó antes en la misma sesión, pasa directo
            if (sessionStorage.getItem('wineshop_mayor_edad') === 'true') {
                window.location.replace('index.html');
            }

            btnMayor.addEventListener('click', () => {
                sessionStorage.setItem('wineshop_mayor_edad', 'true');
                window.location.replace('index.html');
            });

            btnMenor.addEventListener('click', () => {
                window.location.href = 'https://chromedino.com/';
            });
        });
    </script>
</body>
</html>
