<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Edad | WineShop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos_wineshop.css">

    <style>
        /* Estilos dedicados para centrado absoluto y diseño de tarjeta */
        body.age-gate-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #F9F6F0;
            background-image: radial-gradient(#D0C8B8 0.75px, transparent 0.75px);
            background-size: 16px 16px;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }

        .age-card {
            background: #FFFFFF;
            border: 2px solid #D0C8B8;
            border-radius: 12px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 40px rgba(91, 14, 45, 0.12);
            box-sizing: border-box;
        }

        .age-logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 24px;
        }

        .age-title {
            font-family: 'Playfair Display', Georgia, serif;
            color: #5B0E2D;
            font-size: 2rem;
            margin: 0 0 12px 0;
            line-height: 1.2;
        }

        .age-text {
            font-family: 'Inter', sans-serif;
            color: #4A4A4A;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0 0 28px 0;
        }

        .age-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .age-notice {
            font-family: 'Inter', sans-serif;
            font-size: 0.825rem;
            color: #717171;
            margin-top: 20px;
            margin-bottom: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body class="age-gate-page">

    <main class="age-card" role="dialog" aria-labelledby="age-title" aria-describedby="age-desc">
        <img src="img/transparent-logo.png" alt="WineShop Vinos Premium" class="age-logo" width="180">
        
        <h1 id="age-title" class="age-title">¿Eres mayor de edad?</h1>
        
        <p id="age-desc" class="age-text">
            Debes tener al menos 18 años para acceder a WineShop y descubrir nuestra selección de vinos D.O.Ca. Rioja.
        </p>

        <div class="age-actions">
            <button type="button" id="btn-confirm-mayor" class="btn btn-primary btn-full">
                Sí, tengo 18 años o más
            </button>
            <button type="button" id="btn-confirm-menor" class="btn btn-secondary btn-full">
                No, soy menor de 18 años
            </button>
        </div>

        <p class="age-notice">
            Al acceder confirmas que cumples con la edad legal de consumo de alcohol en tu país de residencia.
        </p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnMayor = document.getElementById('btn-confirm-mayor');
            const btnMenor = document.getElementById('btn-confirm-menor');

            // Si ya ha verificado la edad anteriormente, entra directo a la tienda
            if (sessionStorage.getItem('wineshop_mayor_edad') === 'true') {
                window.location.replace('index.html');
            }

            if (btnMayor) {
                btnMayor.addEventListener('click', () => {
                    sessionStorage.setItem('wineshop_mayor_edad', 'true');
                    window.location.replace('index.html');
                });
            }

            if (btnMenor) {
                btnMenor.addEventListener('click', () => {
                    window.location.href = 'html/juego_menores.html';
                });
            }
        });
    </script>
</body>
</html>
