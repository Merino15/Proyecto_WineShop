<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Vino | WineShop Rioja</title>
    <meta name="description" content="Consulta la ficha técnica, notas de cata, maridaje y características del vino seleccionado.">
    <link rel="stylesheet" href="../css/estilos_wineshop.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--espaciado-40);
            margin-top: var(--espaciado-32);
            align-items: center;
        }
        .product-gallery {
            background-color: var(--color-blanco);
            border: 2px solid var(--color-borde);
            border-radius: 8px;
            height: 480px;
            position: relative;
        }
        .specs-table {
            width: 100%;
            border-collapse: collapse;
            margin: var(--espaciado-20) 0;
        }
        .specs-table th, .specs-table td {
            padding: var(--espaciado-12);
            text-align: left;
            border-bottom: 1px solid var(--color-borde);
        }
        .specs-table th {
            color: var(--color-primario-bordeos);
            font-weight: 700;
        }
        @media (max-width: 868px) {
            .product-detail-grid { grid-template-columns: 1fr; }
            .product-gallery { height: 350px; }
        }
    </style>
</head>
<body>

    <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>
    <div id="live-announcer" class="sr-only" aria-live="polite"></div>

    <header class="site-header">
        <div class="container header-container">
            <a href="../index.html" class="logo-link" aria-label="WineShop - Inicio">
                <img src="../img/transparent-logo.png" alt="WineShop Vinos Premium" class="logo" width="160" height="50">
            </a>
            <nav class="main-nav" aria-label="Navegación secundaria">
                <ul>
                    <li><a href="catalogo.html">Volver al Catálogo</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="favoritos.html" class="btn-icon" aria-label="Ver mis vinos favoritos">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span class="badge-count" id="header-fav-count" aria-hidden="true"></span>
                </a>
                <button type="button" class="btn-icon cart-btn" aria-label="Abrir carrito de compras">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                    <span class="badge-count" id="header-cart-count" aria-hidden="true">0</span>
                </button>
            </div>
        </div>
    </header>

    <main id="contenido-principal" class="container section-padding" tabindex="-1">
        <div class="product-detail-grid">
            <div class="product-gallery">
                <model-viewer id="detail-model" src="../models/wine_bottle.glb" alt="Vista 3D de la botella" auto-rotate camera-controls shadow-intensity="1" style="width: 100%; height: 100%;"></model-viewer>
            </div>

            <div class="product-info-box">
                <span id="detail-vintage" class="hero-tag">D.O.Ca. Rioja</span>
                <h1 id="detail-title" class="section-title" style="text-align: left;">Cargando producto...</h1>
                <p id="detail-price" class="wine-price" style="font-size: 2rem;">--,-- €</p>
                <p id="detail-desc" class="body-regular" style="margin-bottom: var(--espaciado-20);"></p>

                <table class="specs-table" aria-label="Ficha técnica del vino">
                    <tbody>
                        <tr><th>Variedad de Uva</th><td id="detail-grape">Tempranillo 100%</td></tr>
                        <tr><th>Crianza</th><td id="detail-aging">20 Meses en Roble</td></tr>
                        <tr><th>Graduación</th><td id="detail-alcohol">14.5% Vol.</td></tr>
                        <tr><th>Temp. Servicio</th><td id="detail-temp">16-18 °C</td></tr>
                    </tbody>
                </table>

                <div style="display: flex; gap: var(--espaciado-16); margin-top: var(--espaciado-24);">
                    <div style="display: flex; align-items: center; border: 2px solid var(--color-borde); border-radius: 4px;">
                        <button type="button" id="qty-minus" aria-label="Reducir cantidad" style="padding: 12px 16px; background: none; border: none; font-weight: 700; cursor: pointer;">-</button>
                        <input type="number" id="qty-input" value="1" min="1" max="99" aria-label="Cantidad de botellas" style="width: 48px; text-align: center; border: none; font-weight: 700;">
                        <button type="button" id="qty-plus" aria-label="Aumentar cantidad" style="padding: 12px 16px; background: none; border: none; font-weight: 700; cursor: pointer;">+</button>
                    </div>
                    <button type="button" id="btn-add-detail" class="btn btn-primary" style="flex: 1;">Añadir al Carrito</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container footer-container">
            <p>© 2026 WineShop. Accesibilidad WCAG 2.1 AAA.</p>
        </div>
    </footer>

    <script src="../js/geo.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
