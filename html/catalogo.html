<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo de Vinos | WineShop Rioja</title>
    <meta name="description" content="Explora nuestro catálogo completo de vinos Tintos, Blancos, Rosados y Gran Reserva de La Rioja. Filtra por precio y tipo de uva.">
    <link rel="canonical" href="https://www.wineshop.es/html/catalogo.html">
    <link rel="stylesheet" href="../css/estilos_wineshop.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

    <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>
    <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <header class="site-header">
        <div class="container header-container">
            <a href="../index.html" class="logo-link" aria-label="WineShop - Inicio">
                <img src="../img/transparent-logo.png" alt="WineShop Vinos Premium" class="logo" width="160" height="50">
            </a>

            <nav class="main-nav" id="main-nav-list" aria-label="Navegación principal">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="catalogo.html" aria-current="page">Catálogo de Vinos</a></li>
                    <li><a href="bodegas.html">Bodegas</a></li>
                    <li><a href="experiencias.html">Experiencias</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="favoritos.html" class="btn-icon" aria-label="Ver mis vinos favoritos">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span class="badge-count" id="header-fav-count" aria-hidden="true"></span>
                </a>
                <button type="button" class="btn-icon cart-btn" aria-label="Abrir carrito de compras">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                    <span class="badge-count" id="header-cart-count" aria-hidden="true">0</span>
                </button>
            </div>
        </div>
    </header>

    <main id="contenido-principal" class="container section-padding" tabindex="-1">
        <h1 class="section-title">Catálogo de Vinos D.O.Ca. Rioja</h1>
        <p class="section-subtitle">Utiliza los filtros accesibles para encontrar la botella perfecta.</p>

        <!-- Filtros Accesibles -->
        <section class="filters-section" style="margin: var(--espaciado-32) 0;" aria-label="Filtros de catálogo">
            <div style="display: flex; gap: var(--espaciado-20); flex-wrap: wrap; background: #FFF; padding: 20px; border: 2px solid var(--color-borde); border-radius: 8px;">
                <div style="flex: 1; min-width: 220px;">
                    <label for="wine-search" style="font-weight: 700; display: block; margin-bottom: 8px;">Buscar por nombre:</label>
                    <input type="text" id="wine-search" placeholder="Ej. Reserva, Tempranillo..." style="width: 100%; padding: 10px; border: 2px solid var(--color-borde); border-radius: 4px; min-height: 44px;">
                </div>
                <div style="flex: 1; min-width: 220px;">
                    <label for="price-range" style="font-weight: 700; display: block; margin-bottom: 8px;">Precio máximo: <span id="price-val">100</span>€</label>
                    <input type="range" id="price-range" min="10" max="100" value="100" style="width: 100%; height: 44px;">
                </div>
            </div>
        </section>

        <!-- Grid de Catálogo Completo -->
        <div id="catalogo-grid" class="products-grid" role="region" aria-label="Lista de vinos filtrada"></div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container footer-container">
            <p>© 2026 WineShop. Accesibilidad WCAG 2.1 AAA.</p>
        </div>
    </footer>

    <script src="../js/geo.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById("wine-search");
            const priceRange = document.getElementById("price-range");
            const priceVal = document.getElementById("price-val");

            const aplicarFiltros = () => {
                const query = searchInput.value.toLowerCase().trim();
                const maxPrice = parseFloat(priceRange.value);
                priceVal.textContent = maxPrice;

                document.querySelectorAll("#catalogo-grid .wine-card").forEach(card => {
                    const nombre = card.querySelector(".wine-name").textContent.toLowerCase();
                    const precio = parseFloat(card.getAttribute("data-price")) || 0;

                    if ((query === "" || nombre.includes(query)) && precio <= maxPrice) {
                        card.style.display = "flex";
                    } else {
                        card.style.display = "none";
                    }
                });
            };

            if (searchInput) searchInput.addEventListener("input", aplicarFiltros);
            if (priceRange) priceRange.addEventListener("input", aplicarFiltros);
            setTimeout(() => { renderizarVinos("catalogo-grid", false); }, 200);
        });
    </script>
</body>
</html>
