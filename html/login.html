<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="WineShop Rioja - Acceso a tu cuenta personal, historial de pedidos y registro de usuarios.">
    <title>Mi Cuenta | WineShop Rioja</title>

    <!-- Preload de hoja de estilos crítica -->
    <link rel="preload" href="../css/estilos_wineshop.css" as="style">
    <link rel="stylesheet" href="../css/estilos_wineshop.css">

    <!-- Favicon e iconos para navegadores escritorio y móviles -->
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../img/favicon.png">
    <link rel="apple-touch-icon" href="../img/favicon.png">

    <!-- Carga diferida del script sin bloqueo de renderizado -->
    <script src="../js/main.js" defer></script>
</head>
<body>

    <!-- Enlace accesible de salto al contenido -->
    <a href="#contenido-principal" class="skip-link" data-i18n="skip_to_content">Saltar al contenido principal</a>

    <!-- Indicador accesible para lectores de pantalla -->
    <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Cabecera principal -->
    <header class="site-header" id="header">
        <div class="container header-container">
            <a href="../index.html" class="logo-link" aria-label="WineShop - Inicio">
                <picture>
                    <!-- En móviles se muestra ../img/favicon.png adaptado al header -->
                    <source media="(max-width: 768px)" srcset="../img/favicon.png">
                    <!-- En pantallas grandes se mantiene el logotipo horizontal completo -->
                    <img src="../img/transparent-logo.png" alt="WineShop Vinos Premium" class="logo" width="160" height="50" fetchpriority="high">
                </picture>
            </a>

            <!-- Botón menú hamburguesa para móvil -->
            <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="main-nav-list" aria-label="Abrir menú de navegación">
                <span class="sr-only">Menú</span>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            
            <!-- Menú de navegación principal -->
            <nav class="main-nav" id="main-nav-list" aria-label="Navegación principal">
                <ul>
                    <li><a href="../index.html" data-i18n="nav_inicio">Inicio</a></li>
                    <li><a href="catalogo.html" data-i18n="nav_catalogo">Catálogo de Vinos</a></li>
                    <li><a href="bodegas.html" data-i18n="nav_bodegas">Bodegas</a></li>
                    <li><a href="experiencias.html" data-i18n="nav_experiencias">Experiencias</a></li>
                </ul>
            </nav>

            <!-- Acciones de cabecera -->
            <div class="header-actions">
                <div class="custom-lang-wrap">
                    <label for="custom-lang-select" class="sr-only">Seleccionar idioma</label>
                    <select id="custom-lang-select" class="lang-select">
                        <option value="es">ES</option>
                        <option value="en">EN</option>
                        <option value="fr">FR</option>
                        <option value="de">DE</option>
                    </select>
                </div>

                <a href="favoritos.html" class="btn-icon" aria-label="Ver mis vinos favoritos" data-i18n-aria="nav_favoritos">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                    <span class="badge-count" id="header-fav-count" aria-hidden="true"></span>
                </a>

                <a href="login.html" class="btn-icon" aria-current="page" aria-label="Mi Cuenta e Iniciar Sesión" data-i18n-aria="nav_cuenta">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                </a>

                <a href="checkout.html" class="btn-icon cart-btn" aria-label="Abrir carrito de compras">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                    </svg>
                    <span class="badge-count" id="header-cart-count" aria-hidden="true">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main id="contenido-principal" tabindex="-1" class="section-padding">
        <div class="container">
            <!-- Encabezado h1 imprescindible para accesibilidad WCAG -->
            <h1 class="sr-only" data-i18n="auth_page_title">Acceso y Registro de Usuario - WineShop</h1>

            <div class="auth-container">
                <div class="auth-card">
                    
                    <!-- Pestañas de acceso / registro -->
                    <div class="auth-tabs" role="tablist" aria-label="Opciones de acceso">
                        <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-login" data-i18n="auth_login_tab">Iniciar Sesión</button>
                        <button type="button" id="tab-register" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-register" data-i18n="auth_register_tab">Crear Cuenta</button>
                    </div>

                    <!-- Panel Iniciar Sesion (Contenedor div neutro accesible) -->
                    <div id="panel-login" role="tabpanel" aria-labelledby="tab-login">
                        <form id="form-login" class="auth-form" novalidate>
                            <div class="form-group">
                                <label for="login-email" data-i18n="auth_email">Correo electrónico</label>
                                <input type="email" id="login-email" class="filter-control" placeholder="ejemplo@wineshop.es" required autocomplete="email">
                            </div>
                            <div class="form-group">
                                <label for="login-password" data-i18n="auth_password">Contraseña</label>
                                <input type="password" id="login-password" class="filter-control" placeholder="••••••••" required autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-primary btn-full" data-i18n="auth_btn_login">Acceder a mi cuenta</button>
                        </form>
                    </div>

                    <!-- Panel Crear Cuenta (Contenedor div neutro accesible) -->
                    <div id="panel-register" role="tabpanel" aria-labelledby="tab-register" class="hidden">
                        <form id="form-register" class="auth-form" novalidate>
                            <div class="form-group">
                                <label for="reg-nombre" data-i18n="auth_name">Nombre completo</label>
                                <input type="text" id="reg-nombre" class="filter-control" placeholder="Tu nombre y apellidos" required autocomplete="name">
                            </div>
                            <div class="form-group">
                                <label for="reg-email" data-i18n="auth_email">Correo electrónico</label>
                                <input type="email" id="reg-email" class="filter-control" placeholder="ejemplo@wineshop.es" required autocomplete="email">
                            </div>
                            <div class="form-group">
                                <label for="reg-password" data-i18n="auth_password">Contraseña</label>
                                <input type="password" id="reg-password" class="filter-control" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                            </div>
                            <div class="form-group">
                                <label for="reg-confirm-password" data-i18n="auth_confirm_password">Confirmar contraseña</label>
                                <input type="password" id="reg-confirm-password" class="filter-control" placeholder="Repite tu contraseña" required autocomplete="new-password">
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="reg-terms" required>
                                    <span><span data-i18n="auth_accept_terms">Acepto la</span> <a href="politica_privacidad.html" target="_blank" rel="noopener noreferrer" data-i18n="footer_privacy">Política de Privacidad</a></span>
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary btn-full" data-i18n="auth_btn_register">Crear mi cuenta</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="site-footer" role="contentinfo">
        <div class="container footer-container">
            <div class="footer-brand">
                <img src="../img/transparent-logo.png" alt="WineShop Logotipo" class="footer-logo" width="140" height="44" loading="lazy">
                <p class="body-regular" data-i18n="footer_copy">© 2026 WineShop. Todos los derechos reservados.</p>
            </div>
            <nav class="footer-links" aria-label="Enlaces legales y accesibilidad">
                <a href="politica_privacidad.html" data-i18n="footer_privacy">Política de Privacidad</a>
                <a href="declaracion_accesibilidad.html" data-i18n="footer_a11y">Declaración de Accesibilidad</a>
            </nav>
        </div>
    </footer>

</body>
</html>
