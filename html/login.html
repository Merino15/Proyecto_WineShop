<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión / Registro | WineShop</title>
    <link rel="stylesheet" href="../css/estilos_wineshop.css">
</head>
<body>

    <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>

    <header class="site-header">
        <div class="container header-container">
            <a href="../index.html" class="logo-link" aria-label="WineShop - Inicio">
                <img src="../img/transparent-logo.png" alt="WineShop Vinos Premium" class="logo" width="160" height="50">
            </a>

            <nav class="main-nav" id="main-nav-list" aria-label="Navegación principal">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo de Vinos</a></li>
                    <li><a href="bodegas.html">Bodegas</a></li>
                    <li><a href="experiencias.html">Experiencias</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="favoritos.html" class="btn-icon" aria-label="Ver mis vinos favoritos">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span class="badge-count" id="header-fav-count" aria-hidden="true"></span>
                </a>
                <a href="checkout.html" class="btn-icon" aria-label="Abrir carrito">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                    <span class="badge-count" id="header-cart-count" aria-hidden="true">0</span>
                </a>
            </div>
        </div>
    </header>

    <main id="contenido-principal" class="container section-padding" tabindex="-1">
        <a href="../index.html" class="back-link">← Volver al inicio</a>

        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-tabs" role="tablist">
                    <button type="button" class="tab-btn active" role="tab" aria-selected="true" id="tab-login">Iniciar Sesión</button>
                    <button type="button" class="tab-btn" role="tab" aria-selected="false" id="tab-register">Crear Cuenta</button>
                </div>

                <form id="form-login">
                    <div class="form-group">
                        <label for="login-email">Correo Electrónico</label>
                        <input type="email" id="login-email" placeholder="ejemplo@correo.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <div class="form-row-flex">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            Recordar sesión
                        </label>
                        <a href="#" style="color: var(--color-primario-bordeos); font-weight: 700; font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>

                    <div class="auth-divider">
                        <span>O accede con</span>
                    </div>

                    <button type="button" class="btn-google">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                        Google
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-container">
            <div class="footer-brand">
                <img src="../img/transparent-logo.png" alt="WineShop Logotipo" class="footer-logo" width="140" height="44">
                <p class="body-regular">© 2026 WineShop. Todos los derechos reservados.</p>
            </div>
            <nav class="footer-links">
                <a href="politica_privacidad.html">Política de Privacidad</a>
                <a href="terminos_condiciones.html">Términos y Condiciones</a>
                <a href="declaracion_accesibilidad.html">Declaración de Accesibilidad</a>
            </nav>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
